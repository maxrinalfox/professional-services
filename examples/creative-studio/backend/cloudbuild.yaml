steps:
  # Step 1: Build the container image using the standard Docker builder.
  # Using SHORT_SHA for the tag is a best practice for traceability.
  # Builds the backend service using Dockerfile.backend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build'
    env: ['DOCKER_BUILDKIT=1']
    args:
      [
        'build',
        '-t',
        '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$SHORT_SHA',
        '-f',
        'Dockerfile.backend',
        '.',
      ]
    # This ensures the build context is the 'backend' folder
    dir: 'examples/creative-studio/backend'

  # Step 2: Push the container image to Google Artifact Registry.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push'
    args:
      [
        'push',
        '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$SHORT_SHA',
      ]

  # Step 3: Deploy to Cloud Run using the gcloud CLI builder.
  # This command creates or updates the service with:
  # - New container image
  # - Environment variables (from Terraform via _BACKEND_ENV_VARS)
  #   Includes both application vars AND database connection variables:
  #   - INSTANCE_CONNECTION_NAME, DB_HOST, DB_NAME, DB_USER
  # - Runtime secrets mapped from Secret Manager (from Terraform via _BACKEND_SECRETS)
  #   Includes both application secrets AND database password:
  #   - DB_PASS (mapped from secret), GOOGLE_TOKEN_AUDIENCE
  # - Custom audiences for token-level validation (from OAUTH_CLIENT_ID secret)
  #   Allows CORS preflight requests through while maintaining security
  #
  # Why set env vars, secrets, and custom_audiences in Cloud Build (not Terraform)?
  # - Terraform creates the service infrastructure without these runtime values
  # - This allows the service to exist while IAM bindings are being created
  # - Cloud Build sets these AFTER the service exists and IAM bindings are ready
  # - Terraform's lifecycle.ignore_changes=[...env] prevents it from reverting these changes
  # - OAUTH_CLIENT_ID secret is populated manually AFTER initial infrastructure deployment
  # - Cloud Build uses availableSecrets to fetch OAUTH_CLIENT_ID at deploy time
  #
  # Note: Using env: section and secretEnv to assign Cloud Build values to shell vars first
  # This follows the bootstrap pattern and avoids Cloud Build substitution validation issues
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy'
    secretEnv:
      - 'OAUTH_CLIENT_ID'
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'SERVICE_NAME=${_SERVICE_NAME}'
      - 'REGION=${_REGION}'
      - 'REPO_NAME=${_REPO_NAME}'
      - 'SHORT_SHA=$SHORT_SHA'
      - 'BACKEND_ENV_VARS=${_BACKEND_ENV_VARS}'
      - 'BACKEND_SECRETS=${_BACKEND_SECRETS}'
    script: |
      #!/bin/bash
      set -e

      IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/${SERVICE_NAME}:${SHORT_SHA}"

      echo "Deploying backend service..."
      echo "Service: $SERVICE_NAME"
      echo "Region: $REGION"
      echo "Image: $IMAGE"
      echo ""
      echo "Pre-Deployment Environment Variables:"
      echo "$BACKEND_ENV_VARS" | tr ',' '\n' | sed 's/^/  /'
      echo ""
      echo "Pre-Deployment Secrets:"
      echo "$BACKEND_SECRETS" | tr ',' '\n' | sed 's/^/  /'
      echo ""
      echo "Pre-Deployment Custom Audiences:"
      echo "  OAuth Client ID (from Secret Manager): $OAUTH_CLIENT_ID"
      echo "  GCP Project ID: $PROJECT_ID"
      echo ""

      # Set custom audiences with both OAuth client ID and project ID
      # OAuth client ID: For frontend/client token validation
      # Project ID: For service-to-service and GCP managed identity calls
      CUSTOM_AUDIENCES="${OAUTH_CLIENT_ID},$PROJECT_ID"

      gcloud run deploy "$SERVICE_NAME" \
        --image="$IMAGE" \
        --region="$REGION" \
        --set-env-vars="$BACKEND_ENV_VARS" \
        --set-secrets="$BACKEND_SECRETS" \
        --set-custom-audiences="$CUSTOM_AUDIENCES" \
        --quiet

      echo ""
      echo "Post-Deployment Configuration:"
      echo "Checking deployed environment variables..."
      gcloud run services describe "$SERVICE_NAME" \
        --region="$REGION" \
        --format='value(spec.template.spec.containers[0].env)' | tr ',' '\n' | grep -E 'INSTANCE_CONNECTION_NAME|DB_HOST|DB_NAME|DB_USER|DB_PASS|ENVIRONMENT|LOG_LEVEL' || true

      echo ""
      echo "Checking deployed custom audiences..."
      gcloud run services describe "$SERVICE_NAME" \
        --region="$REGION" \
        --format='value(metadata.annotations["run.googleapis.com/custom-audiences"])' || echo "Note: custom_audiences annotation may be empty if OAUTH_CLIENT_ID was not available"

# BEST PRACTICE: Explicitly declare the image(s) built by this pipeline.
# This integrates the build with Google Cloud's security features, like showing
# vulnerability scan results in the Cloud Build UI.
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$SHORT_SHA'

# Substitutions will be passed in from the Cloud Build trigger.
# You can override these for manual runs.
substitutions:
  _SERVICE_NAME: 'creative-studio-backend'
  _REPO_NAME: 'cs-be-development-repo' # This matches local.artifact_repo_id
  _REGION: 'us-central1' # TODO: Make Region generic from users input

  # Database connection variables (set by Terraform Cloud Build trigger)
  _INSTANCE_CONNECTION_NAME: 'project:region:instance'
  _DB_HOST: '/cloudsql/project:region:instance'
  _DB_NAME: 'creative_studio'
  _DB_USER: 'cs_app'

  # Environment variables (comma-separated KEY=VALUE pairs)
  # Set by Terraform Cloud Build trigger from backend module
  # Includes application vars, database connection vars, and admin user email
  # Variables: LOG_LEVEL, ENVIRONMENT, INSTANCE_CONNECTION_NAME, DB_HOST, DB_NAME, DB_USER, ADMIN_USER_EMAIL (if configured)
  _BACKEND_ENV_VARS: 'LOG_LEVEL=INFO,ENVIRONMENT=development,INSTANCE_CONNECTION_NAME=project:region:instance,DB_HOST=/cloudsql/project:region:instance,DB_NAME=creative_studio,DB_USER=cs_app,ADMIN_USER_EMAIL=admin@example.com'

  # Runtime secrets (comma-separated ENV_VAR=SECRET_NAME:VERSION pairs)
  # Set by Terraform Cloud Build trigger from backend module
  # Includes both application-level and database-level secrets
  # - DB_PASS: Database password from Secret Manager
  # - GOOGLE_TOKEN_AUDIENCE: OAuth client ID from Secret Manager
  _BACKEND_SECRETS: 'DB_PASS=db-password:latest,GOOGLE_TOKEN_AUDIENCE=OAUTH_CLIENT_ID:latest'

# This section makes the OAuth Client ID available as an environment variable during deployment
# Allows Cloud Build to configure custom_audiences with the actual OAuth client ID
# Note: OAUTH_CLIENT_ID secret must be populated manually after initial infrastructure deployment
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/OAUTH_CLIENT_ID/versions/latest
      env: 'OAUTH_CLIENT_ID'

options:
  logging: CLOUD_LOGGING_ONLY
