steps:
  # Step 1: Build the container image using the standard Docker builder.
  # Using SHORT_SHA for the tag is a best practice for traceability.
  # Builds the backend service using Dockerfile.backend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build'
    env: ['DOCKER_BUILDKIT=1']
    args:
      [
        'build',
        '-t',
        '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$SHORT_SHA',
        '-f',
        'Dockerfile.backend',
        '.',
      ]
    # This ensures the build context is the 'backend' folder
    dir: 'examples/creative-studio/backend'

  # Step 2: Push the container image to Google Artifact Registry.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push'
    args:
      [
        'push',
        '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$SHORT_SHA',
      ]

  # Step 3: Deploy to Cloud Run using the gcloud CLI builder.
  # This command creates or updates the service with:
  # - New container image
  # - Environment variables (from Terraform via _BACKEND_ENV_VARS)
  # - Runtime secrets mapped from Secret Manager (from Terraform via _BACKEND_SECRETS)
  #
  # Why set env vars and secrets in Cloud Build (not Terraform)?
  # - Terraform creates the service infrastructure without env vars/secrets
  # - This allows the service to exist while IAM bindings are being created
  # - Cloud Build sets env vars/secrets AFTER the service exists and IAM bindings are ready
  # - Terraform's lifecycle.ignore_changes=[...env] prevents it from reverting these changes
  #
  # Note: Using env: section to assign Cloud Build substitutions to shell vars first
  # This follows the bootstrap pattern and avoids Cloud Build substitution validation issues
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy'
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'SERVICE_NAME=${_SERVICE_NAME}'
      - 'REGION=${_REGION}'
      - 'REPO_NAME=${_REPO_NAME}'
      - 'SHORT_SHA=$SHORT_SHA'
      - 'BACKEND_ENV_VARS=${_BACKEND_ENV_VARS}'
      - 'BACKEND_SECRETS=${_BACKEND_SECRETS}'
    script: |
      #!/bin/bash
      set -e

      IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/${SERVICE_NAME}:${SHORT_SHA}"

      echo "Deploying backend service..."
      echo "Service: $SERVICE_NAME"
      echo "Region: $REGION"
      echo "Image: $IMAGE"

      gcloud run deploy "$SERVICE_NAME" \
        --image="$IMAGE" \
        --region="$REGION" \
        --set-env-vars="$BACKEND_ENV_VARS" \
        --set-secrets="$BACKEND_SECRETS" \
        --quiet

# BEST PRACTICE: Explicitly declare the image(s) built by this pipeline.
# This integrates the build with Google Cloud's security features, like showing
# vulnerability scan results in the Cloud Build UI.
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$SHORT_SHA'

# Substitutions will be passed in from the Cloud Build trigger.
# You can override these for manual runs.
substitutions:
  _SERVICE_NAME: 'creative-studio-backend'
  _REPO_NAME: 'cs-be-development-repo' # This matches local.artifact_repo_id
  _REGION: 'us-central1' # TODO: Make Region generic from users input

  # Environment variables (comma-separated KEY=VALUE pairs)
  # Set by Terraform Cloud Build trigger from backend module
  _BACKEND_ENV_VARS: 'LOG_LEVEL=INFO,ENVIRONMENT=development'

  # Runtime secrets (comma-separated ENV_VAR=SECRET_NAME:VERSION pairs)
  # Set by Terraform Cloud Build trigger from backend module
  # Maps GOOGLE_TOKEN_AUDIENCE env var to OAUTH_CLIENT_ID secret
  _BACKEND_SECRETS: 'GOOGLE_TOKEN_AUDIENCE=OAUTH_CLIENT_ID:latest'

options:
  logging: CLOUD_LOGGING_ONLY
