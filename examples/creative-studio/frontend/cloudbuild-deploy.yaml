steps:
  # 0. Validate all required secrets are properly populated (not placeholders)
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Validate Secrets'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        #!/bin/bash
        set -e

        echo "════════════════════════════════════════════════════════════════"
        echo "🔐 VALIDATING REQUIRED SECRETS"
        echo "════════════════════════════════════════════════════════════════"
        echo ""

        # Define required secrets with descriptions
        declare -A SECRETS=(
          [FIREBASE_API_KEY]="Firebase API Key (from Firebase Web App config)"
          [FIREBASE_AUTH_DOMAIN]="Firebase Auth Domain (from Firebase Web App config)"
          [FIREBASE_PROJECT_ID]="Firebase Project ID (from GCP Project ID)"
          [FIREBASE_STORAGE_BUCKET]="Firebase Storage Bucket (from Firebase Web App config)"
          [FIREBASE_MESSAGING_SENDER_ID]="Firebase Messaging Sender ID (from Firebase Web App config)"
          [FIREBASE_MEASUREMENT_ID]="Firebase Measurement ID (from Firebase Web App config)"
          [GOOGLE_CLIENT_ID]="OAuth 2.0 Client ID (from GCP Console)"
        )

        FAILED_SECRETS=()
        PLACEHOLDER_PATTERN="placeholder_.*_will_be_updated"

        for SECRET_NAME in "${!SECRETS[@]}"; do
          SECRET_VALUE="$${!SECRET_NAME}"
          SECRET_DESC="${SECRETS[$SECRET_NAME]}"

          # Check if secret exists and is not empty
          if [ -z "$SECRET_VALUE" ]; then
            echo "❌ MISSING: $SECRET_NAME"
            echo "   Description: $SECRET_DESC"
            echo "   Current value: [EMPTY]"
            FAILED_SECRETS+=("$SECRET_NAME")
            echo ""
          elif [[ "$SECRET_VALUE" =~ $PLACEHOLDER_PATTERN ]]; then
            echo "❌ NOT POPULATED: $SECRET_NAME"
            echo "   Description: $SECRET_DESC"
            echo "   Current value: [PLACEHOLDER - needs real value]"
            FAILED_SECRETS+=("$SECRET_NAME")
            echo ""
          else
            echo "✅ VALID: $SECRET_NAME"
            echo "   Description: $SECRET_DESC"
            echo ""
          fi
        done

        echo "════════════════════════════════════════════════════════════════"

        if [ ${#FAILED_SECRETS[@]} -gt 0 ]; then
          echo ""
          echo "❌ BUILD FAILED: ${#FAILED_SECRETS[@]} secret(s) not properly configured"
          echo ""
          echo "Missing or placeholder secrets:"
          for SECRET in "${FAILED_SECRETS[@]}"; do
            echo "  • $SECRET"
          done
          echo ""
          echo "HOW TO FIX:"
          echo "─────────────────────────────────────────────────────────────"
          echo "1. Run the update_secrets.sh script to populate 6 Firebase SDK secrets:"
          echo ""
          echo "   $ cd infra/environments/<your-environment>"
          echo "   $ ./update_secrets.sh"
          echo ""
          echo "2. Then create/update the 2 OAuth secrets manually:"
          echo ""
          echo "   $ OAUTH_CLIENT_ID='your-oauth-client-id'"
          echo "   $ gcloud secrets versions add GOOGLE_CLIENT_ID \\"
          echo "       --data-file=- --project=${PROJECT_ID} \\"
          echo "       <<< \"\$OAUTH_CLIENT_ID\""
          echo ""
          echo "3. After all secrets are populated, retry the frontend build."
          echo ""
          echo "DOCUMENTATION:"
          echo "  See: infra/QUICK_START.md or infra/SECRETS_CONFIGURATION.md"
          echo "─────────────────────────────────────────────────────────────"
          exit 1
        fi

        echo "✅ All required secrets are properly configured!"
        echo ""
    secretEnv:
      - FIREBASE_API_KEY
      - FIREBASE_AUTH_DOMAIN
      - FIREBASE_PROJECT_ID
      - FIREBASE_STORAGE_BUCKET
      - FIREBASE_MESSAGING_SENDER_ID
      - FIREBASE_MEASUREMENT_ID
      - GOOGLE_CLIENT_ID

  # 1. Install dependencies
  - name: 'node:20-alpine' # Standardized version
    id: 'Install Dependencies'
    entrypoint: 'npm'
    args: ['ci']
    dir: examples/creative-studio/frontend
    waitFor: ['Validate Secrets']

  # 2. Inject Secrets and Config from the build environment
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Inject Environment Variables'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Inject into Angular app (environment.prod.ts)
        sed -i "s|BACKEND_URL_PLACEHOLDER|$${_BACKEND_URL}/api|g" src/environments/environment.prod.ts
        sed -i "s|GOOGLE_CLIENT_ID_PLACEHOLDER|$${GOOGLE_CLIENT_ID}|g" src/environments/environment.prod.ts
        # Inject Firebase config
        sed -i "s|FIREBASE_API_KEY_PLACEHOLDER|$${FIREBASE_API_KEY}|g" src/environments/environment.prod.ts
        sed -i "s|FIREBASE_AUTH_DOMAIN_PLACEHOLDER|$${FIREBASE_AUTH_DOMAIN}|g" src/environments/environment.prod.ts
        sed -i "s|FIREBASE_PROJECT_ID_PLACEHOLDER|$${FIREBASE_PROJECT_ID}|g" src/environments/environment.prod.ts
        sed -i "s|FIREBASE_STORAGE_BUCKET_PLACEHOLDER|$${FIREBASE_STORAGE_BUCKET}|g" src/environments/environment.prod.ts
        sed -i "s|FIREBASE_SENDER_ID_PLACEHOLDER|$${FIREBASE_MESSAGING_SENDER_ID}|g" src/environments/environment.prod.ts
        sed -i "s|FIREBASE_APP_ID_PLACEHOLDER|${_FIREBASE_APP_ID}|g" src/environments/environment.prod.ts
        sed -i "s|FIREBASE_MEASUREMENT_ID_PLACEHOLDER|$${FIREBASE_MEASUREMENT_ID}|g" src/environments/environment.prod.ts

        # Inject into Firebase config (firebase.json)
        sed -i "s|SITE_ID_PLACEHOLDER|${PROJECT_ID}|g" firebase.json
        sed -i "s|BACKEND_SERVICE_ID_PLACEHOLDER|$${_BACKEND_SERVICE_ID}|g" firebase.json
    dir: examples/creative-studio/frontend
    env:
      - '_BACKEND_URL=${_BACKEND_URL}'
      - '_FE_SERVICE_NAME=${_FE_SERVICE_NAME}'
      - '_BACKEND_SERVICE_ID=${_BACKEND_SERVICE_ID}'
    secretEnv:
      - FIREBASE_API_KEY
      - FIREBASE_AUTH_DOMAIN
      - FIREBASE_PROJECT_ID
      - FIREBASE_STORAGE_BUCKET
      - FIREBASE_MESSAGING_SENDER_ID
      - FIREBASE_MEASUREMENT_ID
      - GOOGLE_CLIENT_ID
    waitFor: ['Install Dependencies']

  # 3. Build the application
  - name: 'node:20-alpine' # Use the same version
    id: 'Build Angular App'
    entrypoint: 'npm'
    args: ['run', 'build', '--', '--configuration=production']
    env:
      - 'NODE_OPTIONS=--max_old_space_size=4096'
    waitFor: ['Inject Environment Variables']
    dir: examples/creative-studio/frontend

  # 4. Deploy to Firebase Hosting
  - name: 'node:20-alpine' # Use the same version
    id: 'Deploy to Firebase Hosting'
    entrypoint: 'npx'
    args:
      - 'firebase'
      - 'deploy'
      - '--project=${PROJECT_ID}'
      - '--only=hosting:${PROJECT_ID}'
      - '--non-interactive'
    waitFor: ['Build Angular App']
    dir: examples/creative-studio/frontend

  # 5. Summary
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Build Summary'
    entrypoint: 'echo'
    args:
      - |
        ✅ Frontend deployment completed successfully!

        Summary:
        ────────────────────────────────────────────
        ✓ All 7 required secrets validated
        ✓ Frontend built with valid configuration
        ✓ Deployed to Firebase Hosting

        Frontend URL: https://${PROJECT_ID}.firebaseapp.com

        Next steps: Test login functionality
    waitFor: ['Deploy to Firebase Hosting']

# This section makes the secrets available as environment variables during the build
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/GOOGLE_CLIENT_ID/versions/latest
      env: 'GOOGLE_CLIENT_ID'
    # Firebase secrets
    - versionName: projects/${PROJECT_ID}/secrets/FIREBASE_API_KEY/versions/latest
      env: 'FIREBASE_API_KEY'
    - versionName: projects/${PROJECT_ID}/secrets/FIREBASE_AUTH_DOMAIN/versions/latest
      env: 'FIREBASE_AUTH_DOMAIN'
    - versionName: projects/${PROJECT_ID}/secrets/FIREBASE_PROJECT_ID/versions/latest
      env: 'FIREBASE_PROJECT_ID'
    - versionName: projects/${PROJECT_ID}/secrets/FIREBASE_STORAGE_BUCKET/versions/latest
      env: 'FIREBASE_STORAGE_BUCKET'
    - versionName: projects/${PROJECT_ID}/secrets/FIREBASE_MESSAGING_SENDER_ID/versions/latest
      env: 'FIREBASE_MESSAGING_SENDER_ID'
    - versionName: projects/${PROJECT_ID}/secrets/FIREBASE_MEASUREMENT_ID/versions/latest
      env: 'FIREBASE_MEASUREMENT_ID'

options:
  logging: CLOUD_LOGGING_ONLY
