steps:
  # Step 0: Validate required secrets are configured in Secret Manager
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'validate_secrets'
    env:
      - 'PROJECT_ID=$PROJECT_ID'
    script: |
      #!/bin/bash
      set -e

      echo "════════════════════════════════════════════════════════════════"
      echo "🔐 VALIDATING REQUIRED BACKEND SECRETS IN SECRET MANAGER"
      echo "════════════════════════════════════════════════════════════════"
      echo ""

      FAILED_SECRETS=()

      # Check if the secret has a latest version with content
      SECRET_VALUE=$(gcloud secrets versions access latest --secret="OAUTH_CLIENT_ID" --project=${PROJECT_ID} 2>/dev/null || echo "")
      if [ -z "$SECRET_VALUE" ]; then
        echo "❌ EMPTY: OAUTH_CLIENT_ID secret exists but has no value"
        echo "   Description: OAuth 2.0 Client ID for JWT token audience validation"
        FAILED_SECRETS+=("OAUTH_CLIENT_ID")
        echo ""
      else
        echo "✅ VALID: OAUTH_CLIENT_ID secret exists and has a value"
        echo ""
      fi

      echo "════════════════════════════════════════════════════════════════"

      if [ ${#FAILED_SECRETS[@]} -gt 0 ]; then
        echo ""
        echo "❌ BUILD FAILED: ${#FAILED_SECRETS[@]} secret(s) not properly configured"
        echo ""
        echo "Missing or empty secrets:"
        for SECRET in "${FAILED_SECRETS[@]}"; do
          echo "  • $SECRET"
        done
        echo ""
        echo "HOW TO FIX:"
        echo "─────────────────────────────────────────────────────────────"
        echo "The OAUTH_CLIENT_ID secret must be created in Google Secret Manager."
        echo "This is the SAME value used by both frontend and backend."
        echo ""
        echo "Steps:"
        echo "1. If you haven't created the OAuth Client ID in GCP Console:"
        echo "   https://console.cloud.google.com/apis/credentials?project=$PROJECT_ID"
        echo ""
        echo "2. Create a new OAuth 2.0 Client ID (if not already created)"
        echo ""
        echo "3. Create the OAUTH_CLIENT_ID secret in Secret Manager:"
        echo "   $ gcloud secrets create OAUTH_CLIENT_ID --replication-policy=automatic"
        echo ""
        echo "4. Populate the secret with your OAuth Client ID:"
        echo "   $ gcloud secrets versions add OAUTH_CLIENT_ID \\"
        echo "       --data-file=- --project=$PROJECT_ID \\"
        echo "       <<< \"YOUR_CLIENT_ID.apps.googleusercontent.com\""
        echo ""
        echo "5. After populating the secret, retry the backend build."
        echo "─────────────────────────────────────────────────────────────"
        exit 1
      fi

      echo "✅ All required backend secrets are properly configured!"
      echo ""
      echo "Note: Database password is auto-configured via Terraform."
      echo ""
      echo "Note: GOOGLE_TOKEN_AUDIENCE will be injected at runtime via Cloud Run."
      echo ""

  # 1. Install dependencies
  - name: 'node:20-alpine' # Standardized version
    id: 'Install Dependencies'
    entrypoint: 'npm'
    args: ['ci']
    dir: examples/creative-studio/frontend
    waitFor: ['validate_secrets']

  # 2. Inject Secrets and Config from the build environment
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Inject Environment Variables'
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'BACKEND_URL=${_BACKEND_URL}'
      - 'FIREBASE_API_KEY=${_FIREBASE_API_KEY}'
      - 'FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}'
      - 'FIREBASE_PROJECT_ID_SDK=${_FIREBASE_PROJECT_ID_SDK}'
      - 'FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}'
      - 'FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}'
      - 'FIREBASE_APP_ID=${_FIREBASE_APP_ID}'
      - 'FIREBASE_MEASUREMENT_ID=${_FIREBASE_MEASUREMENT_ID}'
      - 'BACKEND_SERVICE_ID=${_BACKEND_SERVICE_ID}'
    script: |
      #!/bin/bash
      set -e

      echo "📝 Injecting configuration into application files..."
      echo ""

      # Retrieve OAUTH_CLIENT_ID from Secret Manager
      echo "Retrieving OAUTH_CLIENT_ID from Secret Manager..."
      OAUTH_CLIENT_ID=$(gcloud secrets versions access latest --secret="OAUTH_CLIENT_ID" --project="${PROJECT_ID}")

      if [ -z "$OAUTH_CLIENT_ID" ]; then
        echo "❌ ERROR: Failed to retrieve OAUTH_CLIENT_ID from Secret Manager"
        exit 1
      fi

      echo "✅ Successfully retrieved OAUTH_CLIENT_ID"
      echo ""

      # Inject into Angular app (environment.prod.ts)
      echo "Injecting backend URL into environment.prod.ts..."
      sed -i "s|BACKEND_URL_PLACEHOLDER|${BACKEND_URL}/api|g" src/environments/environment.prod.ts

      echo "Injecting OAuth Client ID into environment.prod.ts..."
      sed -i "s|GOOGLE_CLIENT_ID_PLACEHOLDER|${OAUTH_CLIENT_ID}|g" src/environments/environment.prod.ts

      # Inject Firebase config from substitutions (auto-discovered via Terraform)
      echo "Injecting Firebase SDK configuration into environment.prod.ts..."
      sed -i "s|FIREBASE_API_KEY_PLACEHOLDER|${FIREBASE_API_KEY}|g" src/environments/environment.prod.ts
      sed -i "s|FIREBASE_AUTH_DOMAIN_PLACEHOLDER|${FIREBASE_AUTH_DOMAIN}|g" src/environments/environment.prod.ts
      sed -i "s|FIREBASE_PROJECT_ID_PLACEHOLDER|${FIREBASE_PROJECT_ID_SDK}|g" src/environments/environment.prod.ts
      sed -i "s|FIREBASE_STORAGE_BUCKET_PLACEHOLDER|${FIREBASE_STORAGE_BUCKET}|g" src/environments/environment.prod.ts
      sed -i "s|FIREBASE_SENDER_ID_PLACEHOLDER|${FIREBASE_MESSAGING_SENDER_ID}|g" src/environments/environment.prod.ts
      sed -i "s|FIREBASE_APP_ID_PLACEHOLDER|${FIREBASE_APP_ID}|g" src/environments/environment.prod.ts
      sed -i "s|FIREBASE_MEASUREMENT_ID_PLACEHOLDER|${FIREBASE_MEASUREMENT_ID}|g" src/environments/environment.prod.ts

      # Inject into Firebase config (firebase.json)
      echo "Injecting Firebase project configuration..."
      sed -i "s|SITE_ID_PLACEHOLDER|${PROJECT_ID}|g" firebase.json
      sed -i "s|BACKEND_SERVICE_ID_PLACEHOLDER|${BACKEND_SERVICE_ID}|g" firebase.json

      echo ""
      echo "✅ All configuration injections completed successfully!"
    dir: examples/creative-studio/frontend
    waitFor: ['validate_secrets']

  # 3. Build the application
  - name: 'node:20-alpine' # Use the same version
    id: 'Build Angular App'
    entrypoint: 'npm'
    args: ['run', 'build', '--', '--configuration=production']
    env:
      - 'NODE_OPTIONS=--max_old_space_size=4096'
    waitFor: ['Inject Environment Variables']
    dir: examples/creative-studio/frontend

  # 4. Deploy to Firebase Hosting
  - name: 'node:20-alpine' # Use the same version
    id: 'Deploy to Firebase Hosting'
    entrypoint: 'npx'
    args:
      - 'firebase'
      - 'deploy'
      - '--project=${PROJECT_ID}'
      - '--only=hosting:${PROJECT_ID}'
      - '--non-interactive'
    waitFor: ['Build Angular App']
    dir: examples/creative-studio/frontend

  # 5. Summary
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Build Summary'
    entrypoint: 'echo'
    args:
      - |
        ✅ Frontend deployment completed successfully!

        Summary:
        ────────────────────────────────────────────
        ✓ All 7 required secrets validated
        ✓ Frontend built with valid configuration
        ✓ Deployed to Firebase Hosting

        Frontend URL: https://${PROJECT_ID}.firebaseapp.com

        Next steps: Test login functionality
    waitFor: ['Deploy to Firebase Hosting']

# This section makes the unified OAuth credential available as an environment variable during the build
# Firebase SDK secrets are passed via Cloud Build substitutions (_FIREBASE_*) instead
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/OAUTH_CLIENT_ID/versions/latest
      env: 'OAUTH_CLIENT_ID'

options:
  logging: CLOUD_LOGGING_ONLY
