steps:
  # 1. Install dependencies
  - name: 'node:20-alpine' # Standardized version
    id: 'Install Dependencies'
    entrypoint: 'npm'
    args: ['ci']
    dir: examples/creative-studio/frontend

  # 2. Inject Secrets and Config from the build environment
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Inject Environment Variables'
    secretEnv:
      - 'OAUTH_CLIENT_ID'
    script: |
      #!/bin/bash
      set -e

      echo "📝 Pre-validation: Displaying all Cloud Build substitutions..."
      echo ""
      echo "=== SUBSTITUTION VALUES ==="
      echo "_BACKEND_URL: ${_BACKEND_URL}"
      echo "_FIREBASE_API_KEY: ${_FIREBASE_API_KEY}"
      echo "_FIREBASE_AUTH_DOMAIN: ${_FIREBASE_AUTH_DOMAIN}"
      echo "_FIREBASE_PROJECT_ID_SDK: ${_FIREBASE_PROJECT_ID_SDK}"
      echo "_FIREBASE_STORAGE_BUCKET: ${_FIREBASE_STORAGE_BUCKET}"
      echo "_FIREBASE_MESSAGING_SENDER_ID: ${_FIREBASE_MESSAGING_SENDER_ID}"
      echo "_FIREBASE_APP_ID: ${_FIREBASE_APP_ID}"
      echo "_FIREBASE_MEASUREMENT_ID: ${_FIREBASE_MEASUREMENT_ID}"
      echo "_BACKEND_SERVICE_ID: ${_BACKEND_SERVICE_ID}"
      echo "_FIREBASE_PROJECT_ID: ${_FIREBASE_PROJECT_ID}"
      echo "OAUTH_CLIENT_ID (from Secret Manager): $OAUTH_CLIENT_ID"
      echo "PROJECT_ID (from Cloud Build): $PROJECT_ID"
      echo ""

      echo "📝 Injecting configuration into application files..."
      echo ""

      # Inject into Angular app (environment.prod.ts)
      echo "Injecting backend URL into environment.prod.ts..."
      sed -i "s|BACKEND_URL_PLACEHOLDER|${_BACKEND_URL}/api|g" src/environments/environment.prod.ts

      echo "Injecting OAuth Client ID into environment.prod.ts..."
      sed -i "s|GOOGLE_CLIENT_ID_PLACEHOLDER|${OAUTH_CLIENT_ID}|g" src/environments/environment.prod.ts

      # Inject Firebase config from substitutions (auto-discovered via Terraform)
      echo "Injecting Firebase SDK configuration into environment.prod.ts..."
      sed -i "s|FIREBASE_API_KEY_PLACEHOLDER|${_FIREBASE_API_KEY}|g" src/environments/environment.prod.ts
      sed -i "s|FIREBASE_AUTH_DOMAIN_PLACEHOLDER|${_FIREBASE_AUTH_DOMAIN}|g" src/environments/environment.prod.ts
      sed -i "s|FIREBASE_PROJECT_ID_PLACEHOLDER|${_FIREBASE_PROJECT_ID_SDK}|g" src/environments/environment.prod.ts
      sed -i "s|FIREBASE_STORAGE_BUCKET_PLACEHOLDER|${_FIREBASE_STORAGE_BUCKET}|g" src/environments/environment.prod.ts
      sed -i "s|FIREBASE_SENDER_ID_PLACEHOLDER|${_FIREBASE_MESSAGING_SENDER_ID}|g" src/environments/environment.prod.ts
      sed -i "s|FIREBASE_APP_ID_PLACEHOLDER|${_FIREBASE_APP_ID}|g" src/environments/environment.prod.ts
      sed -i "s|FIREBASE_MEASUREMENT_ID_PLACEHOLDER|${_FIREBASE_MEASUREMENT_ID}|g" src/environments/environment.prod.ts

      # Inject into Firebase config (firebase.json)
      echo "Injecting Firebase project configuration..."
      sed -i "s|SITE_ID_PLACEHOLDER|${_FIREBASE_PROJECT_ID}|g" firebase.json
      sed -i "s|BACKEND_SERVICE_ID_PLACEHOLDER|${_BACKEND_SERVICE_ID}|g" firebase.json

      echo ""
      echo "📝 Post-validation: Verifying injected values..."
      echo ""
      echo "=== VERIFICATION ==="
      echo "Checking environment.prod.ts for injected values:"
      grep "apiKey:" src/environments/environment.prod.ts
      grep "authDomain:" src/environments/environment.prod.ts
      grep "projectId:" src/environments/environment.prod.ts
      grep "storageBucket:" src/environments/environment.prod.ts
      grep "messagingSenderId:" src/environments/environment.prod.ts
      grep "appId:" src/environments/environment.prod.ts
      grep "measurementId:" src/environments/environment.prod.ts
      grep "GOOGLE_CLIENT_ID:" src/environments/environment.prod.ts
      grep "backendURL:" src/environments/environment.prod.ts
      echo ""
      echo "Checking firebase.json for injected values:"
      grep "hosting:" firebase.json | head -3
      echo ""
      echo "✅ All configuration injections completed successfully!"
    dir: examples/creative-studio/frontend

  # 3. Build the application
  - name: 'node:20-alpine' # Use the same version
    id: 'Build Angular App'
    entrypoint: 'npm'
    args: ['run', 'build', '--', '--configuration=production']
    env:
      - 'NODE_OPTIONS=--max_old_space_size=4096'
    waitFor: ['Inject Environment Variables']
    dir: examples/creative-studio/frontend

  # 4. Deploy to Firebase Hosting
  - name: 'node:20-alpine' # Use the same version
    id: 'Deploy to Firebase Hosting'
    entrypoint: 'npx'
    args:
      - 'firebase'
      - 'deploy'
      - '--project=${PROJECT_ID}'
      - '--only=hosting:${PROJECT_ID}'
      - '--non-interactive'
    waitFor: ['Build Angular App']
    dir: examples/creative-studio/frontend

  # 5. Summary
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Build Summary'
    entrypoint: 'echo'
    args:
      - |
        ✅ Frontend deployment completed successfully!

        Summary:
        ────────────────────────────────────────────
        ✓ All 7 required secrets validated
        ✓ Frontend built with valid configuration
        ✓ Deployed to Firebase Hosting

        Frontend URL: https://${PROJECT_ID}.firebaseapp.com

        Next steps: Test login functionality
    waitFor: ['Deploy to Firebase Hosting']

# This section makes the unified OAuth credential available as an environment variable during the build
# Firebase SDK secrets are passed via Cloud Build substitutions (_FIREBASE_*) instead
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/OAUTH_CLIENT_ID/versions/latest
      env: 'OAUTH_CLIENT_ID'

options:
  logging: CLOUD_LOGGING_ONLY
