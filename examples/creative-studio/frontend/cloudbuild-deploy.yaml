steps:
  # 0. Validate OAuth secrets are configured (only manual secret now)
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Validate OAuth Secrets'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        #!/bin/bash
        set -e

        echo "════════════════════════════════════════════════════════════════"
        echo "🔐 VALIDATING REQUIRED OAUTH SECRETS"
        echo "════════════════════════════════════════════════════════════════"
        echo ""

        # OAuth credential secret (unified for both frontend and backend)
        declare -A SECRETS=(
          [OAUTH_CLIENT_ID]="OAuth 2.0 Client ID (must be created in GCP Console)"
        )

        FAILED_SECRETS=()
        PLACEHOLDER_PATTERN="placeholder_.*_will_be_updated"

        for SECRET_NAME in "${!SECRETS[@]}"; do
          SECRET_VALUE="$${!SECRET_NAME}"
          SECRET_DESC="${SECRETS[$SECRET_NAME]}"

          # Check if secret exists and is not empty
          if [ -z "$SECRET_VALUE" ]; then
            echo "❌ MISSING: $SECRET_NAME"
            echo "   Description: $SECRET_DESC"
            echo "   Current value: [EMPTY]"
            FAILED_SECRETS+=("$SECRET_NAME")
            echo ""
          elif [[ "$SECRET_VALUE" =~ $PLACEHOLDER_PATTERN ]]; then
            echo "❌ NOT POPULATED: $SECRET_NAME"
            echo "   Description: $SECRET_DESC"
            echo "   Current value: [PLACEHOLDER - needs real value]"
            FAILED_SECRETS+=("$SECRET_NAME")
            echo ""
          else
            echo "✅ VALID: $SECRET_NAME"
            echo "   Description: $SECRET_DESC"
            echo ""
          fi
        done

        echo "════════════════════════════════════════════════════════════════"

        if [ ${#FAILED_SECRETS[@]} -gt 0 ]; then
          echo ""
          echo "❌ BUILD FAILED: ${#FAILED_SECRETS[@]} secret(s) not properly configured"
          echo ""
          echo "Missing or placeholder secrets:"
          for SECRET in "${FAILED_SECRETS[@]}"; do
            echo "  • $SECRET"
          done
          echo ""
          echo "HOW TO FIX:"
          echo "─────────────────────────────────────────────────────────────"
          echo "Create the OAuth Client ID in GCP Console:"
          echo ""
          echo "1. Go to: https://console.cloud.google.com/apis/credentials?project=${PROJECT_ID}"
          echo "2. Create a new OAuth 2.0 Client ID of type 'Web application'"
          echo "3. Add authorized redirect URIs:"
          echo "   • https://${PROJECT_ID}.firebaseapp.com/__/auth/handler"
          echo "   • https://${PROJECT_ID}.web.app/__/auth/handler"
          echo ""
          echo "4. Then populate the secret (this is the SAME value for backend too):"
          echo ""
          echo "   $ gcloud secrets versions add OAUTH_CLIENT_ID \\"
          echo "       --data-file=- --project=${PROJECT_ID} \\"
          echo "       <<< \"YOUR_OAUTH_CLIENT_ID\""
          echo ""
          echo "5. After the secret is populated, retry the frontend build."
          echo "6. Backend will use the SAME OAUTH_CLIENT_ID secret (no separate setup needed)"
          echo "─────────────────────────────────────────────────────────────"
          exit 1
        fi

        echo "✅ All required OAuth secrets are properly configured!"
        echo ""
        echo "Note: Firebase SDK secrets are auto-configured from Terraform."
        echo "Note: Backend will use the SAME OAUTH_CLIENT_ID secret."
        echo ""
    secretEnv:
      - OAUTH_CLIENT_ID

  # 1. Install dependencies
  - name: 'node:20-alpine' # Standardized version
    id: 'Install Dependencies'
    entrypoint: 'npm'
    args: ['ci']
    dir: examples/creative-studio/frontend
    waitFor: ['Validate OAuth Secrets']

  # 2. Inject Secrets and Config from the build environment
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Inject Environment Variables'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Inject into Angular app (environment.prod.ts)
        sed -i "s|BACKEND_URL_PLACEHOLDER|${_BACKEND_URL}/api|g" src/environments/environment.prod.ts
        sed -i "s|GOOGLE_CLIENT_ID_PLACEHOLDER|${OAUTH_CLIENT_ID}|g" src/environments/environment.prod.ts
        # Inject Firebase config from substitutions (auto-discovered via Terraform)
        sed -i "s|FIREBASE_API_KEY_PLACEHOLDER|${_FIREBASE_API_KEY}|g" src/environments/environment.prod.ts
        sed -i "s|FIREBASE_AUTH_DOMAIN_PLACEHOLDER|${_FIREBASE_AUTH_DOMAIN}|g" src/environments/environment.prod.ts
        sed -i "s|FIREBASE_PROJECT_ID_PLACEHOLDER|${_FIREBASE_PROJECT_ID_SDK}|g" src/environments/environment.prod.ts
        sed -i "s|FIREBASE_STORAGE_BUCKET_PLACEHOLDER|${_FIREBASE_STORAGE_BUCKET}|g" src/environments/environment.prod.ts
        sed -i "s|FIREBASE_SENDER_ID_PLACEHOLDER|${_FIREBASE_MESSAGING_SENDER_ID}|g" src/environments/environment.prod.ts
        sed -i "s|FIREBASE_APP_ID_PLACEHOLDER|${_FIREBASE_APP_ID}|g" src/environments/environment.prod.ts
        sed -i "s|FIREBASE_MEASUREMENT_ID_PLACEHOLDER|${_FIREBASE_MEASUREMENT_ID}|g" src/environments/environment.prod.ts

        # Inject into Firebase config (firebase.json)
        sed -i "s|SITE_ID_PLACEHOLDER|${PROJECT_ID}|g" firebase.json
        sed -i "s|BACKEND_SERVICE_ID_PLACEHOLDER|${_BACKEND_SERVICE_ID}|g" firebase.json
    dir: examples/creative-studio/frontend
    secretEnv:
      - OAUTH_CLIENT_ID
    waitFor: ['Validate OAuth Secrets']

  # 3. Build the application
  - name: 'node:20-alpine' # Use the same version
    id: 'Build Angular App'
    entrypoint: 'npm'
    args: ['run', 'build', '--', '--configuration=production']
    env:
      - 'NODE_OPTIONS=--max_old_space_size=4096'
    waitFor: ['Inject Environment Variables']
    dir: examples/creative-studio/frontend

  # 4. Deploy to Firebase Hosting
  - name: 'node:20-alpine' # Use the same version
    id: 'Deploy to Firebase Hosting'
    entrypoint: 'npx'
    args:
      - 'firebase'
      - 'deploy'
      - '--project=${PROJECT_ID}'
      - '--only=hosting:${PROJECT_ID}'
      - '--non-interactive'
    waitFor: ['Build Angular App']
    dir: examples/creative-studio/frontend

  # 5. Summary
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Build Summary'
    entrypoint: 'echo'
    args:
      - |
        ✅ Frontend deployment completed successfully!

        Summary:
        ────────────────────────────────────────────
        ✓ All 7 required secrets validated
        ✓ Frontend built with valid configuration
        ✓ Deployed to Firebase Hosting

        Frontend URL: https://${PROJECT_ID}.firebaseapp.com

        Next steps: Test login functionality
    waitFor: ['Deploy to Firebase Hosting']

# This section makes the unified OAuth credential available as an environment variable during the build
# Firebase SDK secrets are passed via Cloud Build substitutions (_FIREBASE_*) instead
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/OAUTH_CLIENT_ID/versions/latest
      env: 'OAUTH_CLIENT_ID'

options:
  logging: CLOUD_LOGGING_ONLY
